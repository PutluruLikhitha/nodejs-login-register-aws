<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="loginMessage"></p>

        <a href="register.html">Don't have an account? Register</a>

    </div>

    <script src="script.js"></script>

</body>
</html>
